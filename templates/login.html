<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --verde:    #00c896;
      --azul-osc: #0a1628;
      --azul-med: #112240;
      --gris:     #8892a4;
      --blanco:   #e8edf5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--azul-osc);
      font-family: 'Space Grotesk', sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* fondo animado */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #00c89620 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #0066ff18 0%, transparent 50%);
      pointer-events: none;
    }
    .card-login {
      background: var(--azul-med);
      border: 1px solid #1e3a5f;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,.5);
      position: relative;
      z-index: 1;
      animation: slideUp .5s ease both;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem; font-weight: 700;
      color: var(--verde);
      letter-spacing: -1px;
    }
    .logo span { color: var(--blanco); }
    .subtitle { color: var(--gris); font-size: .9rem; margin-top: .25rem; }
    .form-control, .form-select {
      background: #0d1f3c;
      border: 1px solid #1e3a5f;
      color: var(--blanco);
      border-radius: 10px;
      padding: .75rem 1rem;
      font-family: 'Space Grotesk', sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus, .form-select:focus {
      background: #0d1f3c;
      border-color: var(--verde);
      color: var(--blanco);
      box-shadow: 0 0 0 3px #00c89630;
    }
    .form-label { color: var(--gris); font-size: .85rem; font-weight: 600; letter-spacing: .05em; }
    .btn-ts {
      background: var(--verde);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      padding: .75rem;
      width: 100%;
      transition: transform .15s, box-shadow .15s;
    }
    .btn-ts:hover { transform: translateY(-1px); box-shadow: 0 8px 24px #00c89650; color: #000; }
    .divider { color: var(--gris); font-size: .8rem; text-align: center; margin: 1rem 0; position: relative; }
    .divider::before, .divider::after {
      content:''; position: absolute; top: 50%; width: 40%; height: 1px;
      background: #1e3a5f;
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }
    .link-ts { color: var(--verde); cursor: pointer; font-weight: 600; text-decoration: none; }
    .link-ts:hover { text-decoration: underline; }
    .alert-ts {
      background: #ff4d6d22; border: 1px solid #ff4d6d55;
      color: #ff8fa3; border-radius: 10px; font-size: .85rem; padding: .75rem 1rem;
    }
    .input-group-text {
      background: #0d1f3c; border: 1px solid #1e3a5f; color: var(--gris);
      border-radius: 10px 0 0 10px;
    }
    .input-icon .form-control { border-radius: 0 10px 10px 0; }
    /* tabs */
    .tab-btns { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    .tab-btn {
      flex: 1; padding: .5rem; border-radius: 8px; border: 1px solid #1e3a5f;
      background: transparent; color: var(--gris); font-family: 'Space Grotesk', sans-serif;
      font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .tab-btn.active { background: var(--verde); color: #000; border-color: var(--verde); }
  </style>
</head>
<body>
<div class="card-login">
  <div class="mb-4">
    <div class="logo">Tech<span>Store</span></div>
    <div class="subtitle">Sistema de Ventas — Panel Administrativo</div>
  </div>

  <!-- Tabs login / registro -->
  <div class="tab-btns">
    <button class="tab-btn active" id="tab-login"   onclick="showTab('login')">Iniciar Sesión</button>
    <button class="tab-btn"        id="tab-registro" onclick="showTab('registro')">Registrarse</button>
  </div>

  <!-- Alerta -->
  <div id="alerta" class="alert-ts mb-3" style="display:none"></div>

  <!-- Formulario Login -->
  <div id="form-login">
    <div class="mb-3">
      <label class="form-label">EMAIL</label>
      <div class="input-group input-icon">
        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
        <input type="email" id="l-email" class="form-control" placeholder="correo@ejemplo.com">
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">CONTRASEÑA</label>
      <div class="input-group input-icon">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" id="l-pass" class="form-control" placeholder="••••••••">
      </div>
    </div>
    <button class="btn btn-ts" onclick="login()">
      <i class="bi bi-box-arrow-in-right me-2"></i>Entrar al Sistema
    </button>
  </div>

  <!-- Formulario Registro -->
  <div id="form-registro" style="display:none">
    <div class="mb-3">
      <label class="form-label">NOMBRE COMPLETO</label>
      <input type="text" id="r-nombre" class="form-control" placeholder="Juan Pérez">
    </div>
    <div class="mb-3">
      <label class="form-label">EMAIL</label>
      <div class="input-group input-icon">
        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
        <input type="email" id="r-email" class="form-control" placeholder="correo@ejemplo.com">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">CONTRASEÑA</label>
      <div class="input-group input-icon">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" id="r-pass" class="form-control" placeholder="••••••••">
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">ROL</label>
      <select id="r-rol" class="form-select">
        <option value="vendedor">Vendedor</option>
        <option value="admin">Administrador</option>
      </select>
    </div>
    <button class="btn btn-ts" onclick="registro()">
      <i class="bi bi-person-plus-fill me-2"></i>Crear Cuenta
    </button>
  </div>
</div>

<script>
function showTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form-login').style.display    = isLogin ? '' : 'none';
  document.getElementById('form-registro').style.display = isLogin ? 'none' : '';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-registro').classList.toggle('active', !isLogin);
  document.getElementById('alerta').style.display = 'none';
}

function mostrarAlerta(msg, tipo = 'error') {
  const el = document.getElementById('alerta');
  el.textContent = msg;
  el.style.background = tipo === 'ok' ? '#00c89622' : '#ff4d6d22';
  el.style.borderColor = tipo === 'ok' ? '#00c89655' : '#ff4d6d55';
  el.style.color       = tipo === 'ok' ? '#00c896'   : '#ff8fa3';
  el.style.display = '';
}

async function login() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  if (!email || !pass) { mostrarAlerta('Completa todos los campos'); return; }

  const res = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password: pass})
  });
  const data = await res.json();
  if (res.ok) {
    mostrarAlerta(`¡Bienvenido, ${data.nombre}!`, 'ok');
    setTimeout(() => window.location.href = '/', 800);
  } else {
    mostrarAlerta(data.error || 'Error al iniciar sesión');
  }
}

async function registro() {
  const nombre = document.getElementById('r-nombre').value.trim();
  const email  = document.getElementById('r-email').value.trim();
  const pass   = document.getElementById('r-pass').value;
  const rol    = document.getElementById('r-rol').value;
  if (!nombre || !email || !pass) { mostrarAlerta('Completa todos los campos'); return; }

  const res = await fetch('/api/auth/registro', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nombre, email, password: pass, rol})
  });
  const data = await res.json();
  if (res.ok) {
    mostrarAlerta('¡Cuenta creada! Ahora inicia sesión', 'ok');
    setTimeout(() => showTab('login'), 1200);
  } else {
    mostrarAlerta(data.error || 'Error al registrarse');
  }
}

// Enter para enviar
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('form-login').style.display !== 'none') login();
  else registro();
});
</script>
</body>
</html>
